# Onset Window Classifier V12_clean — V4 + CQT (isolated A/B test)
#
# Clean A/B test: identical to V4 except CQT replaces mel_lowfreq
#   - Same V1 cache (same per-window mels, same 500ms window)
#   - CQT added as supplementary file: 128 bins (30-~960 Hz, 24 bins/oct, trimmed from 144)
#   - CQT replaces mel_lowfreq via use_lowfreq_branch (dataset loads cqt key first)
#   - Everything else identical to V4 (HPSS, enhanced spectral, same hyperparams)
#
# This isolates the single change we care about: does CQT give better
# low-frequency resolution for tom vs kick/snare discrimination?
#
# Requires: CQT added to existing cache via scripts/add_cqt_to_cache.py

paths:
  data_dir: "/mnt/ml-data/dataset_drums"
  output_dir: "outputs/onset_classifier_v12_clean"
  checkpoint_dir: "checkpoints/onset_classifier_v12_clean"

cache_dir: "outputs/onset_classifier/cache"

dataset:
  sample_rate: 44100
  n_mels: 128
  fine_n_fft: 1024
  fine_hop: 256
  coarse_n_fft: 4096
  coarse_hop: 512
  window_before_ms: 100
  window_after_ms: 400
  context_size: 4

model:
  num_classes: 8
  branch_channels: [1, 32, 64, 128, 256]
  context_size: 4
  context_hidden: 64
  spectral_dim: 48
  classifier_hidden: 512
  dropout: 0.3
  use_freq_attn: false
  use_hpss: true
  enhanced_spectral: true
  use_lowfreq_branch: true    # CQT branch (128 bins, trimmed from 144 to save 4.2 GiB RAM)

training:
  batch_size: 256
  epochs: 120
  learning_rate: 0.001
  min_lr: 0.000005
  weight_decay: 0.0001
  gradient_clip: 1.0
  num_workers: 0
  eval_interval: 2
  checkpoint_every: 5
  early_stop_patience: 25
  max_train_batches: 2000
  max_val_batches: 500
  mixup_alpha: 0.3
  resume_from: "checkpoints/onset_classifier_v12_clean/epoch_105.pt"

loss:
  class_weights: [1.0, 1.0, 1.0, 2.0, 1.0, 2.0, 1.0, 1.5]
  focal_gamma: 0.0
  label_smoothing: 0.0

augmentation:
  noise_std: 0.005
  gain_db_range: [-3.0, 3.0]
  spec_augment: true
  freq_mask_width: 12
  time_mask_width: 8
