# Drums V13 — Two-Stage Onset Detection + Classification
#
# Key innovations over V8-Direct (best previous: 70.3% overall F1):
#
#   1. Two-stage architecture:
#      - Stage 1: Binary onset detector (class-agnostic). Toms get the same
#        gradient signal as kicks — no rare-class problem for detection.
#      - Stage 2: 8-class classifier runs ONLY at detected onset frames.
#        This is inherently ~balanced since every onset IS some class.
#
#   2. Frequency sub-band features: split 128 mel bins into 4 perceptual
#      sub-bands before LSTM. Gives explicit frequency cues for tom vs cymbal.
#
#   3. Onset-conditioned classification loss: classification gradients flow
#      only from onset frames, not from the 97% silence. Dramatically cleaner
#      signal for rare classes.
#
#   4. No warm-start needed. The architecture is different enough that
#      V6/V8 weights wouldn't map cleanly.
#
# Target: All 8 classes >90% F1
# Running on: DGX Spark (GB10, 128GB unified, 20-core ARM)

paths:
  data_dir: "/mnt/ml-data/dataset_drums"
  output_dir: "outputs/drums_v13"
  checkpoint_dir: "checkpoints/drums_v13"

# Model Configuration
model:
  type: "two_stage_crnn"
  sample_rate: 44100
  n_mels: 128
  hop_length: 512
  n_fft: 2048

  # CNN encoder (shared backbone)
  conv_channels: [64, 128, 256, 512]

  # Frequency sub-band config
  # Split 128 mel bins into 4 perceptually-motivated sub-bands:
  #   Sub-bass (bins 0-31):    ~20-300 Hz  → Kick fundamental, floor tom
  #   Mid (bins 32-63):        ~300-2kHz   → Snare body, tom fundamentals
  #   High-mid (bins 64-95):   ~2-6kHz     → Snare wire, hi-hat attack, ride bell
  #   Brilliance (bins 96-127): ~6-20kHz   → Cymbal shimmer, crash wash
  freq_subbands: [32, 64, 96, 128]
  subband_proj_dim: 256         # 128→256 for richer sub-band features

  # Temporal modeling (LSTM + sliding window attention)
  lstm_hidden: 640              # 512→640 for more capacity (~42M total params)
  lstm_layers: 3
  attention_heads: 8
  attention_window: 512         # >= T=430 → uses fast full attention (no sliding window)
  dropout: 0.3

  # Stage 1: Onset detection head
  onset_detector_hidden: 320    # 256→320 (scaled with LSTM)

  # Stage 2: Onset classification head
  classifier_hidden: 640        # 512→640 (scaled with LSTM)
  num_classes: 8

  predict_velocity: true

# Training Configuration
training:
  batch_size: 16          # ~5GB GPU peak with 5s + full attention
  accumulation_steps: 1   # Real batch=16 is enough
  epochs: 60
  
  learning_rate: 0.0002       # V13.1: slightly lower than 3e-4 for fine-tuning phase
  min_lr: 0.00001
  weight_decay: 0.0001
  warmup_epochs: 3
  
  segment_duration_sec: 5.0     # Match V8.1 — drum onset context is local
  checkpoint_every: 5
  early_stop_patience: 15
  f1_eval_interval: 2
  max_train_batches: 5000       # Cap per epoch (~80K samples, matches V8.1 volume)
  max_val_batches: 1000         # Enough for reliable val loss

  num_workers: 4
  pin_memory: false       # Spark: unified memory
  gradient_clip: 1.0

# Loss Configuration
loss:
  # Stage 1: Binary onset detection loss
  onset_pos_weight: 20.0      # ~2% of frames have onsets
  onset_focal_gamma: 2.0

  # Stage 2: 8-class classification loss (onset-conditioned)
  # These weights handle imbalance AMONG onsets (not frame-level imbalance).
  # Distribution among onsets: Kick 28.3%, Snare 23.2%, HiHat 26.6%,
  #   HighTom 0.7%, Ride 11.5%, LowTom 0.8%, Crash 7.2%, FloorTom 1.6%
  # V13.1: Boosted rare class weights to fix regression vs V8.1
  # Original V13: [1.0, 1.2, 1.1, 30.0, 2.5, 28.0, 4.0, 14.0]
  # NaN was from AMP fp16, not weight magnitude — safe to use full boost now
  classify_class_weight: [1.0, 1.2, 1.1, 50.0, 5.0, 45.0, 8.0, 25.0]
  classify_focal_gamma: 1.0     # V13.1: 2.0→1.0 (less dampening for uncertain rare classes)
  classify_label_smoothing: 0.05  # Slight smoothing for regularization

  # Loss component balance
  onset_loss_weight: 1.0
  classify_loss_weight: 2.0       # Classification is the harder task
  velocity_loss_weight: 0.3

# Augmentation
augmentation:
  enabled: true
  freq_mask_param: 27
  time_mask_param: 50
  num_freq_masks: 2
  num_time_masks: 2

  # Tom injection: splice real tom hits into other segments
  tom_injection:
    enabled: true
    probability: 0.4         # 40% of training segments get synthetic toms
    max_injections: 3        # Up to 3 injected per segment
    pitch_shift_cents: 100   # ±100 cents random shift

# Weights & Biases - DISABLED
wandb:
  project: null
  entity: null
  tags: []
  log_freq: 50

# Inference thresholds (per-class optimal from threshold sweep)
# Per-class sweep maximizes each class independently — better for rare classes.
# Overall: 82.7% → 83.8% (+1.1%)
# Key gains: HighTom +12.6%, LowTom +7.4%, FloorTom +7.8%
inference:
  onset_threshold: 0.5
  class_thresholds:
    Kick: 0.50
    Snare: 0.55
    HiHat: 0.50
    HighTom: 0.80
    Ride: 0.55
    LowTom: 0.70
    Crash: 0.60
    FloorTom: 0.75

# Dataset split
split:
  train_ratio: 0.85
  test_ratio: 0.15
  seed: 42
