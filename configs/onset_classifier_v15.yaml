# Onset Window Classifier V15 — V12c + Bleed Augmentation
#
# Based on V12_clean (best single model: 83.8% F1)
# Key change: bleed_cache_dir adds instrument-bleed-augmented mel/CQT features
# During training, 50% of samples use clean cache, 50% use bleed cache
# This closes the domain gap between clean training stems and Demucs-separated inference audio
#
# Requires: Bleed cache built via scripts/preprocess_bleed_cache.py

paths:
  data_dir: "/mnt/ml-data/dataset_drums"
  output_dir: "outputs/onset_classifier_v15"
  checkpoint_dir: "checkpoints/onset_classifier_v15"

cache_dir: "outputs/onset_classifier/cache"
bleed_cache_dir: "outputs/onset_classifier/cache_bleed"
bleed_prob: 0.5

dataset:
  sample_rate: 44100
  n_mels: 128
  fine_n_fft: 1024
  fine_hop: 256
  coarse_n_fft: 4096
  coarse_hop: 512
  window_before_ms: 100
  window_after_ms: 400
  context_size: 4

model:
  num_classes: 8
  branch_channels: [1, 32, 64, 128, 256]
  context_size: 4
  context_hidden: 64
  spectral_dim: 48
  classifier_hidden: 512
  dropout: 0.3
  use_freq_attn: false
  use_hpss: true
  enhanced_spectral: true
  use_lowfreq_branch: true

training:
  batch_size: 256
  epochs: 120
  learning_rate: 0.001
  min_lr: 0.000005
  weight_decay: 0.0001
  gradient_clip: 1.0
  num_workers: 0
  eval_interval: 2
  checkpoint_every: 5
  early_stop_patience: 25
  max_train_batches: 2000
  max_val_batches: 500
  mixup_alpha: 0.3

loss:
  class_weights: [1.0, 1.0, 1.0, 2.0, 1.0, 2.0, 1.0, 1.5]
  focal_gamma: 0.0
  label_smoothing: 0.0

augmentation:
  noise_std: 0.005
  gain_db_range: [-3.0, 3.0]
  spec_augment: true
  freq_mask_width: 12
  time_mask_width: 8
