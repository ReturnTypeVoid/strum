# V12c fine-tune on Demucs-output drums (100 eval-set songs, 80/20 split).
# Diagnostic: does Demucs-domain training data close the 5pt full-pipeline gap?
#
# Source: outputs/demucs_eval_100 (Demucs htdemucs output) + community labels.
# Train onsets: ~75K (77 songs).  Test onsets: ~24K (23 songs).
#
# Architecture: identical to v12c_community (so checkpoint loads cleanly).

paths:
  data_dir: "/mnt/ml-data/demucs_finetune_100"
  output_dir: "outputs/onset_classifier_v12c_demucs_ft"
  checkpoint_dir: "checkpoints/onset_classifier_v12c_demucs_ft"

cache_dir: "outputs/onset_classifier_demucs100/cache"

# Use all training onsets (small dataset)
max_train_onsets: 0

dataset:
  sample_rate: 44100
  n_mels: 128
  fine_n_fft: 1024
  fine_hop: 256
  coarse_n_fft: 4096
  coarse_hop: 512
  window_before_ms: 100
  window_after_ms: 400
  context_size: 4

model:
  num_classes: 8
  branch_channels: [1, 32, 64, 128, 256]
  context_size: 4
  context_hidden: 64
  spectral_dim: 48
  classifier_hidden: 512
  dropout: 0.3
  use_freq_attn: false
  use_hpss: true
  enhanced_spectral: true
  use_lowfreq_branch: true

training:
  batch_size: 256
  epochs: 12                # small dataset; watch for overfit
  learning_rate: 0.0001     # 5x lower than from-scratch (0.0005) for fine-tune
  min_lr: 0.000001
  weight_decay: 0.0001
  gradient_clip: 1.0
  num_workers: 0
  eval_interval: 1          # eval every epoch
  checkpoint_every: 2
  early_stop_patience: 6
  max_train_batches: 0      # unlimited (use all ~290 batches/epoch)
  max_val_batches: 0
  mixup_alpha: 0.0          # disable mixup for fine-tune

warm_start:
  enabled: true
  checkpoint: "checkpoints/onset_classifier_v12c_community/best_f1.pt"

loss:
  class_weights: [1.0, 1.0, 1.0, 2.0, 1.0, 2.0, 1.0, 1.5]
  focal_gamma: 0.0
  label_smoothing: 0.0

augmentation:
  noise_std: 0.005
  gain_db_range: [-3.0, 3.0]
  spec_augment: true
  freq_mask_width: 12
  time_mask_width: 8
